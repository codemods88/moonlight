appId: com.moonlight.app
name: Thread error recovery
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      MOONLIGHT_ACTIVE_EMAIL: ${MOONLIGHT_SCREENSHOT_EMAIL}
- openLink: "moonlight:///thread?botId=${MOONLIGHT_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*weekly limit.*"
    timeout: 20000
- assertVisible: "Add model"
- assertNotVisible: "Change model"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-limit-banner
- tapOn: "Details"
- extendedWaitUntil:
    visible: ".*reply stopped at its key's weekly limit.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-limit-details
