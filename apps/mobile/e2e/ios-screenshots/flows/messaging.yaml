appId: com.moonlight.app
name: Messaging
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      MOONLIGHT_ACTIVE_EMAIL: ${MOONLIGHT_SCREENSHOT_EMAIL}
- openLink: "moonlight:///messaging"
- extendedWaitUntil:
    visible: ".*#launch.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-messaging
- tapOn: ".*#launch.*"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-team-conversation
