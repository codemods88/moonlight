appId: com.moonlight.app
name: Inbox
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      MOONLIGHT_ACTIVE_EMAIL: ${MOONLIGHT_SCREENSHOT_EMAIL}
- extendedWaitUntil:
    visible: ".*Researcher.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-inbox
# Start at the row's midpoint so the swipe reveals actions without committing one.
- swipe:
    from:
      text: ".*Researcher.*"
    direction: LEFT
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-swipe-actions
- tapOn: "Activity"
- extendedWaitUntil:
    visible: ".*Recent.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-activity
- tapOn: "Activity"
- openLink: "moonlight:///artifacts"
- extendedWaitUntil:
    visible: ".*launch-notes.txt.*|.*No artifacts yet.*|.*Artifacts.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-artifacts
