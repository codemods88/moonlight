appId: com.moonlight.app
name: Workspace
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      MOONLIGHT_ACTIVE_EMAIL: ${MOONLIGHT_SCREENSHOT_EMAIL}
- openLink: "moonlight:///board"
- extendedWaitUntil:
    visible: ".*Draft the launch announcement.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-board
- openLink: "moonlight:///approvals"
- extendedWaitUntil:
    visible: ".*example.com.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-approval-rules
- openLink: "moonlight:///approval-rule-add"
- extendedWaitUntil:
    visible: "Browser act"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02b-add-approval-rule
- openLink: "moonlight:///vault"
- extendedWaitUntil:
    visible: ".*deploy_token.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-vault
- tapOn: "Help desk"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-vault-item
- tapOn: "Remove"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-vault-remove
- tapOn: "Cancel"
- tapOn: "Done"
- tapOn: "New item"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 06-vault-new
- tapOn: "Card"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07-vault-new-card
- tapOn: "Cancel"
- openLink: "moonlight:///archived-bots"
- extendedWaitUntil:
    visible: ".*Archived fixture.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08-archived-bots
- openLink: "moonlight:///spaces"
- extendedWaitUntil:
    visible: "New private space"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 09-spaces
- openLink: "moonlight:///space?spaceId=${MOONLIGHT_SCREENSHOT_TEAM_SPACE_ID}"
- extendedWaitUntil:
    visible: "Settings for this Space"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 09b-space-settings
- openLink: "moonlight:///space-members?spaceId=${MOONLIGHT_SCREENSHOT_TEAM_SPACE_ID}"
- extendedWaitUntil:
    visible: "Owner"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 10-space-members
