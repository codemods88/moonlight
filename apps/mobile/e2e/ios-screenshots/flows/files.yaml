appId: com.moonlight.app
name: Files
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      MOONLIGHT_ACTIVE_EMAIL: ${MOONLIGHT_SCREENSHOT_EMAIL}
- openLink: "moonlight:///artifact?artifactId=${MOONLIGHT_SCREENSHOT_ARTIFACT_ID}"
- extendedWaitUntil:
    visible: ".*Collect three customer quotes.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-text
- openLink: "moonlight:///artifact?artifactId=${MOONLIGHT_SCREENSHOT_MARKDOWN_ID}"
- extendedWaitUntil:
    visible: ".*Collect customer quotes.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-markdown
- openLink: "moonlight:///artifact?artifactId=${MOONLIGHT_SCREENSHOT_PDF_ID}"
- extendedWaitUntil:
    visible: ".*launch-brief.pdf.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 03-pdf
- openLink: "moonlight:///artifact?artifactId=${MOONLIGHT_SCREENSHOT_ARCHIVE_ID}"
- extendedWaitUntil:
    visible: ".*No preview.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 04-no-preview
- openLink: "moonlight:///image?artifactId=${MOONLIGHT_SCREENSHOT_IMAGE_ID}&name=launch-chart.png&mimeType=image%2Fpng&botId=${MOONLIGHT_SCREENSHOT_BOT_ID}"
- extendedWaitUntil:
    visible: ".*launch-chart.*"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05-image
- openLink: "moonlight:///artifact?artifactId=${MOONLIGHT_SCREENSHOT_VIDEO_ID}"
- extendedWaitUntil:
    visible: ".*launch-demo.mp4.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-video
- openLink: "moonlight:///artifacts"
- extendedWaitUntil:
    visible: '.*launch-demo\.mp4.*'
    timeout: 15000
- tapOn: '.*launch-demo\.mp4.*'
- extendedWaitUntil:
    visible: "More"
    timeout: 15000
- swipe:
    start: "85%,50%"
    end: "15%,50%"
    duration: 400
- extendedWaitUntil:
    visible: 'launch-chart\.png'
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 07-media-gallery
- tapOn: "More"
- assertVisible: "Download"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 08-media-actions
