appId: com.moonlight.app
name: Split view
---
# On a phone this is a single column; on an unfolded iPhone Duo the chat list sits beside it.
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      MOONLIGHT_ACTIVE_EMAIL: ${MOONLIGHT_SCREENSHOT_EMAIL}
- openLink: "moonlight:///thread?botId=${MOONLIGHT_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*The fixture workspace is ready.*"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-chat-beside-list
- runFlow:
    when:
      visible: "Connect apps"
    commands:
      - tapOn: "Settings"
      - extendedWaitUntil:
          visible: "General"
          timeout: 10000
      - tapOn: "Dismiss"
      - extendedWaitUntil:
          visible: ".*The fixture workspace is ready.*"
          timeout: 5000
- runFlow:
    when:
      visible: "Hide chats"
    commands:
      - tapOn: "Hide chats"
      - extendedWaitUntil:
          visible: "Show chats"
          timeout: 5000
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: 02-chats-hidden
      - tapOn: "Show chats"
