appId: com.moonlight.app
---
- runFlow: launch-app.yaml
- runFlow:
    when:
      visible: "Sign up for Moonlight"
    commands:
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Sign in to Moonlight"
    timeout: 15000
- tapOn: "Email"
- inputText: ${MOONLIGHT_ACTIVE_EMAIL}
- tapOn: "Password"
- inputText: ${MOONLIGHT_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Don’t allow"
    optional: true
- tapOn:
    text: "Don't allow"
    optional: true
# A new account answers the signup survey before the inbox.
- extendedWaitUntil:
    visible: "Account|Settings|.*How did you hear about us.*"
    timeout: 40000
