# See ../../self-host-kubernetes.md before applying.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: moonlight-controller
  labels:
    moonlight.example/phase: foundation
  namespace: moonlight
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: moonlight-computers
  labels:
    moonlight.example/phase: foundation
  namespace: moonlight-sandboxes
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - get
      - delete
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: moonlight-computers
  labels:
    moonlight.example/phase: foundation
  namespace: moonlight-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: moonlight-computers
subjects:
  - kind: ServiceAccount
    name: moonlight-controller
    namespace: moonlight
